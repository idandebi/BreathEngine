name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - run: python -m pytest -q python/tests

  cpp:
    name: C++ core + parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopencv-dev
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build -j
      - run: ctest --test-dir cpp/build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Parity (C++ vs Python reference)
        run: python python/tools/parity.py --cpp cpp/build/be_parity --workdir ${{ runner.temp }}/parity

  android:
    name: Android SDK + sample app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build AAR and sample APK
        working-directory: android
        run: ./gradlew :breathengine:assembleRelease :sample:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: breathengine-sample-apk
          path: android/sample/build/outputs/apk/debug/*.apk
